[package]
name = "stellpoker-test-vectors"
version = "0.1.0"
edition = "2021"
description = "Single source of truth for the test vectors shared by the Noir circuits and the Rust services: Poseidon2 hashes, commitments, Merkle roots and proofs, and batch packing digests."
license = "MIT"
publish = false

[dependencies]
ark-bn254 = "0.6"
ark-ff = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same Poseidon2 build the coordinator uses to recompute circuit
# commitments; its t=4 BN254 permutation is Noir's std::hash::poseidon2_permutation.
taceo-poseidon2 = { version = "0.3", default-features = false, features = ["bn254", "t4"] }
