[package]
name = "batched_hand_packing"
type = "bin"
authors = ["Stellar Poker"]
compiler_version = ">=0.36.0"

[dependencies]
stellar_poker_lib = { path = "../lib" }

[package.metadata.circuit]
description = "Prototype for Issue #529: packs the public inputs of up to BATCH hand proofs into one batch digest so an aggregated settlement exposes two public values instead of BATCH copies of every hand's inputs."
