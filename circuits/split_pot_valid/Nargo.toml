[package]
name = "split_pot_valid"
type = "bin"
authors = ["Stellar Poker"]
compiler_version = ">=0.36.0"

[dependencies]
stellar_poker_lib = { path = "../lib" }

[package.metadata.circuit]
description = "Prove that a split-pot (Hi-Lo) allocation is correct: the pot is divided 50/50 between the best high hand and the best qualifying low hand, with odd chips to high."
