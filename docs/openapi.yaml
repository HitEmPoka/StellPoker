openapi: "3.0.3"
info:
  title: StellPoker Coordinator API
  version: "0.1.0"
  description: |
    REST API for the MPC Coordinator service that orchestrates the MPC committee
    for game proving and card shuffling in StellPoker.

servers:
  - url: http://localhost:8080
    description: Local development

# Issue #1011: the Axum router registers more paths than the public API spec.
# Every registered route must either appear under `paths:` below or be matched
# by one of these explicit exclusions. `scripts/check-api-spec.py` enforces
# this in both directions, so adding a route without documenting it (or without
# a written rationale here) fails CI.
x-route-exclusions:
  - exact: ["GET /", "GET /metrics"]
    reason: >
      HTML operator dashboard and Prometheus scrape endpoint. They are not
      part of the JSON API and are consumed by browsers/monitoring, not API
      clients.
  - suffix: "/ws"
    reason: >
      WebSocket upgrades are not representable as OpenAPI 3.0 operations.
      Their subscribe/push protocol is documented separately in docs/api/.
  - prefix: "/api/admin/"
    reason: >
      RBAC-protected operator/admin surface. It is intentionally excluded
      from the public API contract; internal operators use the admin docs.
  - prefix: "/api/mpc/"
    reason: >
      Internal MPC node protocol (version negotiation, benchmark, identity,
      attestation, partition, decommission, preemption). Authenticated by the
      MPC API-key middleware, not part of the public API.
  - prefix: "/api/node/"
    reason: >
      Internal dynamic MPC node discovery/heartbeat endpoints, protected by
      the MPC API-key middleware.
  - prefix: "/api/plugins"
    reason: >
      Internal plugin-management/introspection endpoints. Not a stable
      public contract; plugin implementations are deployment-specific.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns operational metrics and connectivity status of the coordinator.
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/stats:
    get:
      operationId: getStats
      summary: Global stats and leaderboard
      responses:
        "200":
          description: Stats response
          content:
            application/json:
              schema:
                type: object

  /api/chain-config:
    get:
      operationId: getChainConfig
      summary: Public chain configuration parameters
      responses:
        "200":
          description: Chain config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainConfigResponse"
        "503":
          description: Soroban not configured

  /api/flags:
    get:
      operationId: listFlags
      summary: List all feature flags
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: object

  /api/flags/{key}:
    post:
      operationId: setFlag
      summary: Set a feature flag
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFlagBody"
      responses:
        "200":
          description: Flag updated
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request

  /api/tables/create:
    post:
      operationId: createTable
      summary: Create a new poker table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "200":
          description: Table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
        "400":
          description: Invalid parameters
        "401":
          description: Unauthorized
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: On-chain submission failed
        "503":
          description: Soroban not configured

  /api/tables/open:
    get:
      operationId: listOpenTables
      summary: List open tables with available wallet slots
      responses:
        "200":
          description: List of open tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenTablesResponse"

  /api/table/{table_id}/join:
    post:
      operationId: joinTable
      summary: Register wallet-to-seat mapping for a wallet that joined on-chain
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTableResponse"
        "400":
          description: Invalid table id
        "401":
          description: Unauthorized
        "404":
          description: Table not found
        "409":
          description: Conflict (not waiting phase or wallet not seated)
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/table/{table_id}/lobby:
    get:
      operationId: getTableLobby
      summary: Get lobby/seat information for a table
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Lobby info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableLobbyResponse"
        "400":
          description: Invalid table id
        "404":
          description: Table not found

  /api/table/{table_id}/request-deal:
    post:
      operationId: requestDeal
      summary: Initiate MPC deal (distribute cards)
      parameters:
        - $ref: "#/components/parameters/tableId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealRequest"
      responses:
        "200":
          description: Deal successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealResponse"
        "400":
          description: Invalid parameters
        "409":
          description: Table already in active hand
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: MPC or Soroban failure
        "503":
          description: No MPC nodes configured

  /api/table/{table_id}/request-reveal/{phase}:
    post:
      operationId: requestReveal
      summary: Reveal board cards for a given phase (flop/turn/river)
      parameters:
        - $ref: "#/components/parameters/tableId"
        - name: phase
          in: path
          required: true
          schema:
            type: string
            enum: [flop, turn, river]
      responses:
        "200":
          description: Reveal successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResponse"
        "400":
          description: Invalid phase
        "404":
          description: Session not found
        "409":
          description: Phase out of order
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: MPC or Soroban failure
        "503":
          description: No MPC nodes configured

  /api/table/{table_id}/request-showdown:
    post:
      operationId: requestShowdown
      summary: Trigger showdown proof and settle the hand
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Showdown complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowdownResponse"
        "404":
          description: Session not found
        "409":
          description: Not in river/showdown phase
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: MPC or Soroban failure
        "503":
          description: No MPC nodes configured

  /api/table/{table_id}/player-action:
    post:
      operationId: playerAction
      summary: Submit a player betting action
      parameters:
        - $ref: "#/components/parameters/tableId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerActionResponse"
        "400":
          description: Invalid action or amount
        "401":
          description: Unauthorized
        "409":
          description: On-chain contract error
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: On-chain submission failed
        "503":
          description: Soroban not configured

  /api/table/{table_id}/player/{address}/cards:
    get:
      operationId: getPlayerCards
      summary: Get a player's hole cards (authenticated)
      parameters:
        - $ref: "#/components/parameters/tableId"
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerCardsResponse"
        "401":
          description: Unauthorized
        "404":
          description: Table or player not found
        "502":
          description: MPC failure

  /api/table/{table_id}/state:
    get:
      operationId: getTableState
      summary: Get the on-chain table state
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Table state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableStateResponse"
        "503":
          description: Soroban unavailable

  /api/committee/status:
    get:
      operationId: getCommitteeStatus
      summary: MPC committee health status
      responses:
        "200":
          description: Committee status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitteeStatusResponse"

  /api/session/{session_id}/status:
    get:
      operationId: getMpcSessionStatus
      summary: Get the status of an MPC session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                type: object
                required: [session_id, table_id, status, elapsed_secs]
                properties:
                  session_id:
                    type: string
                  table_id:
                    type: integer
                  status:
                    type: string
                  cancel_reason:
                    type: string
                    nullable: true
                  elapsed_secs:
                    type: integer
        "404":
          description: Session not found

  /api/session/{session_id}/cancel:
    post:
      operationId: cancelMpcSession
      summary: Cancel an MPC session (deprecated, use admin endpoint)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session cancelled
        "401":
          description: Unauthorized
        "404":
          description: Session not found

  /api/readyz:
    get:
      operationId: getReadiness
      summary: Blue-green readiness probe (503 while draining)
      responses:
        "200":
          description: Ready
        "503":
          description: Draining or under maintenance

  /api/benchmarks:
    get:
      operationId: getBenchmarks
      summary: Latest coordinator/MPC benchmark measurements
      responses:
        "200":
          description: Benchmark report
          content:
            application/json:
              schema:
                type: object

  /api/leader:
    get:
      operationId: getLeaderStatus
      summary: Current MPC leader status
      responses:
        "200":
          description: Leader status
          content:
            application/json:
              schema:
                type: object

  /api/stats/player/{address}:
    get:
      operationId: getPlayerHudStats
      summary: HUD statistics for one player
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player HUD stats
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Player not found

  /api/ratings/leaderboard:
    get:
      operationId: getRatingLeaderboard
      summary: Player rating leaderboard
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: object

  /api/tables/overview:
    get:
      operationId: listTableOverview
      summary: Overview of all tables (including full ones)
      responses:
        "200":
          description: Table overview
          content:
            application/json:
              schema:
                type: object

  /api/table/{table_id}/rit-opt-in:
    post:
      operationId: ritOptIn
      summary: Opt into RIT (random isolation table) allocation
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Opt-in recorded
        "401":
          description: Unauthorized
        "404":
          description: Table not found

  /api/table/{table_id}/transfer-chips:
    post:
      operationId: transferChips
      summary: Transfer chips between players at a table
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Transfer recorded
        "401":
          description: Unauthorized
        "400":
          description: Invalid transfer
        "404":
          description: Table not found

  /api/table/{table_id}/players:
    get:
      operationId: getPlayersPaginated
      summary: List seated players at a table
      parameters:
        - $ref: "#/components/parameters/tableId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated players
          content:
            application/json:
              schema:
                type: object

  /api/table/{table_id}/hand-history/chunk:
    get:
      operationId: getHandHistoryChunk
      summary: Read a chunk of a table's hand history
      parameters:
        - $ref: "#/components/parameters/tableId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Hand history chunk
          content:
            application/json:
              schema:
                type: object

  /api/table/{table_id}/mpc-status:
    get:
      operationId: getMpcStatus
      summary: MPC session status for a table
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: MPC status
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Table not found

  /api/table/{table_id}/spectators:
    get:
      operationId: getSpectatorCount
      summary: Number of spectators watching a table
      parameters:
        - $ref: "#/components/parameters/tableId"
      responses:
        "200":
          description: Spectator count
          content:
            application/json:
              schema:
                type: object

  /api/csp/report:
    post:
      operationId: reportCsp
      summary: Ingest a browser Content-Security-Policy violation report
      responses:
        "200":
          description: Report accepted
        "400":
          description: Malformed report

  /api/csp/reports:
    get:
      operationId: listCspReports
      summary: List recent CSP violation reports
      responses:
        "200":
          description: CSP reports
          content:
            application/json:
              schema:
                type: object

  /api/tournaments:
    get:
      operationId: listTournaments
      summary: List tournaments
      responses:
        "200":
          description: Tournaments
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: createTournament
      summary: Create a sit-and-go tournament
      responses:
        "200":
          description: Tournament created
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid configuration

  /api/tournaments/{id}:
    get:
      operationId: getTournament
      summary: Get a tournament by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Tournament not found

  /api/tournaments/{id}/register:
    post:
      operationId: registerTournamentPlayer
      summary: Register a player for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player registered
        "404":
          description: Tournament not found

  /api/tournaments/{id}/start:
    post:
      operationId: startTournament
      summary: Start a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tournament started
        "404":
          description: Tournament not found

  /api/tournaments/{id}/hand-result:
    post:
      operationId: recordTournamentHandResult
      summary: Record a tournament hand result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Result recorded
        "404":
          description: Tournament not found

  /api/tournaments/{id}/balancing:
    get:
      operationId: getTournamentBalancing
      summary: Table balancing plan for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balancing plan
          content:
            application/json:
              schema:
                type: object

  /api/tournaments/{id}/cancel:
    post:
      operationId: cancelTournament
      summary: Cancel a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tournament cancelled
        "404":
          description: Tournament not found

  /api/tournaments/{id}/hand-for-hand:
    post:
      operationId: setTournamentHandForHand
      summary: Toggle hand-for-hand play
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setting updated
        "404":
          description: Tournament not found

  /api/tournaments/{id}/tables/{table}/start-hand:
    post:
      operationId: startTournamentTableHand
      summary: Start the next hand at a tournament table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hand started
        "404":
          description: Tournament or table not found

  /api/tournaments/{id}/hand-counts:
    get:
      operationId: getTournamentHandCounts
      summary: Hands played per tournament table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hand counts
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    tableId:
      name: table_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 0

  responses:
    # Issue #601: every rate-limited endpoint returns this shape — a 429
    # with a Retry-After header the client must honor before retrying.
    RateLimited:
      description: Rate limited. Honor the Retry-After header before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

  schemas:
    HealthResponse:
      type: object
      required: [uptime_seconds, mpc_nodes, soroban_rpc, active_mpc_sessions, request_metrics]
      properties:
        uptime_seconds:
          type: integer
        mpc_nodes:
          type: array
          items:
            $ref: "#/components/schemas/MpcNodeHealth"
        soroban_rpc:
          $ref: "#/components/schemas/SorobanHealth"
        active_mpc_sessions:
          type: integer
        request_metrics:
          type: object

    MpcNodeHealth:
      type: object
      required: [endpoint, connected]
      properties:
        endpoint:
          type: string
        connected:
          type: boolean
        last_heartbeat:
          type: string
          nullable: true

    SorobanHealth:
      type: object
      required: [endpoint, status]
      properties:
        endpoint:
          type: string
        status:
          type: string
          enum: [connected, disconnected]

    ChainConfigResponse:
      type: object
      required: [rpc_url, network_passphrase, poker_table_contract]
      properties:
        rpc_url:
          type: string
        network_passphrase:
          type: string
        poker_table_contract:
          type: string

    SetFlagBody:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    CreateTableRequest:
      type: object
      properties:
        max_players:
          type: integer
          minimum: 2
          maximum: 6
        solo:
          type: boolean
        buy_in:
          type: string

    CreateTableResponse:
      type: object
      required: [table_id, max_players, joined_wallets]
      properties:
        table_id:
          type: integer
        max_players:
          type: integer
        joined_wallets:
          type: integer

    OpenTablesResponse:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/OpenTableInfo"

    OpenTableInfo:
      type: object
      required: [table_id, phase, max_players, joined_wallets, open_wallet_slots]
      properties:
        table_id:
          type: integer
        phase:
          type: string
        max_players:
          type: integer
        joined_wallets:
          type: integer
        open_wallet_slots:
          type: integer

    JoinTableResponse:
      type: object
      required: [table_id, seat_index, seat_address, joined_wallets, max_players]
      properties:
        table_id:
          type: integer
        seat_index:
          type: integer
        seat_address:
          type: string
        joined_wallets:
          type: integer
        max_players:
          type: integer

    TableLobbyResponse:
      type: object
      required: [table_id, phase, max_players, seats, joined_wallets]
      properties:
        table_id:
          type: integer
        phase:
          type: string
        max_players:
          type: integer
        joined_wallets:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/LobbySeat"

    LobbySeat:
      type: object
      required: [seat_index, chain_address]
      properties:
        seat_index:
          type: integer
        chain_address:
          type: string
        wallet_address:
          type: string
          nullable: true

    DealRequest:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            type: string

    DealResponse:
      type: object
      required: [status, deck_root, hand_commitments, proof_size, session_id]
      properties:
        status:
          type: string
        deck_root:
          type: string
        hand_commitments:
          type: array
          items:
            type: string
        proof_size:
          type: integer
        session_id:
          type: string
        tx_hash:
          type: string
          nullable: true

    RevealResponse:
      type: object
      required: [status, cards, proof_size, session_id]
      properties:
        status:
          type: string
        cards:
          type: array
          items:
            type: integer
        proof_size:
          type: integer
        session_id:
          type: string
        tx_hash:
          type: string
          nullable: true

    ShowdownResponse:
      type: object
      required: [status, winner, winner_index, proof_size, session_id]
      properties:
        status:
          type: string
        winner:
          type: string
        winner_index:
          type: integer
        proof_size:
          type: integer
        session_id:
          type: string
        tx_hash:
          type: string
          nullable: true

    PlayerActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [fold, check, call, bet, raise, allin, all_in]
        amount:
          type: integer
          nullable: true

    PlayerActionResponse:
      type: object
      required: [status, action, player]
      properties:
        status:
          type: string
        action:
          type: string
        amount:
          type: integer
          nullable: true
        player:
          type: string
        tx_hash:
          type: string
          nullable: true

    PlayerCardsResponse:
      type: object
      required: [card1, card2, salt1, salt2]
      properties:
        card1:
          type: integer
        card2:
          type: integer
        salt1:
          type: string
        salt2:
          type: string

    TableStateResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string

    CommitteeStatusResponse:
      type: object
      required: [nodes, healthy, status]
