# Routes intentionally absent from docs/openapi.yaml.
#
# The coordinator's production router is assembled in
# services/coordinator/src/main.rs. Every registered route must either have an
# operation in docs/openapi.yaml or appear exactly once below with a category
# whose written rationale explains why it is not part of the public REST API.
# scripts/check-api-spec.py enforces this in both directions and also rejects
# stale entries, so removing a route requires removing its exclusion here.
version: 1

categories:
  internal-ops: >-
    Internal operator/debug endpoint (dashboard, Prometheus metrics, leader
    state, benchmark state). It is not a public player REST API.
  admin: >-
    Admin-only control plane authenticated with x-admin-* headers. These are
    operator actions, not part of the public player API; the separate
    docs/api/openapi.yaml publishing profile documents them for operators.
  control-plane: >-
    Coordinator/MPC node control plane used internally by MPC nodes and
    operators (registration, heartbeats, versions, identity, attestation,
    partitions, benchmarks and CSP reports). Game clients never call it.
  plugins: >-
    Internal plugin lifecycle and diagnostics surface. Plugin authors use it
    locally; it is not a stable external consumer API.
  websocket: >-
    WebSocket upgrade endpoint. OpenAPI 3.0 cannot describe the WS upgrade
    protocol as a REST operation, so these routes are excluded from the REST
    spec and listed explicitly here instead.

routes:
