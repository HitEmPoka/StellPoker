[package]
name = "stellar-zk-cards-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
stellar_zk_cards = { path = "." }
arbitrary = { version = "1.3", features = ["derive"] }

[lib]
name = "stellar_zk_cards_fuzz"
crate-type = ["rlib"]

[[bin]]
name = "fuzz_hand_eval"
path = "fuzz_targets/fuzz_hand_eval.rs"
test = false
doc = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
