[package]
name = "coordinator-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
coordinator = { path = "." }
arbitrary = { version = "1.3", features = ["derive"] }

[lib]
name = "coordinator_fuzz"
crate-type = ["rlib"]

[[bin]]
name = "fuzz_table_lifecycle"
path = "fuzz_targets/fuzz_table_lifecycle.rs"
test = false
doc = false

[[bin]]
name = "fuzz_game_actions"
path = "fuzz_targets/fuzz_game_actions.rs"
test = false
doc = false

[[bin]]
name = "fuzz_state_queries"
path = "fuzz_targets/fuzz_state_queries.rs"
test = false
doc = false

[[bin]]
name = "fuzz_node_discovery"
path = "fuzz_targets/fuzz_node_discovery.rs"
test = false
doc = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
