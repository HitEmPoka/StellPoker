name: Cost Model

# Issue #586: keep the operator cost calculator runnable and its report
# generation working. This is a smoke test, not a benchmark.

on:
  push:
    paths:
      - "scripts/cost_model.py"
      - "docs/cost-model.md"
      - ".github/workflows/cost-model.yml"
  pull_request:
    paths:
      - "scripts/cost_model.py"
      - "docs/cost-model.md"
      - ".github/workflows/cost-model.yml"

permissions:
  contents: read

jobs:
  cost-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python3 -m py_compile scripts/cost_model.py

      - name: Default scenario (markdown)
        run: python3 scripts/cost_model.py --hands-per-day 10000

      - name: Priority scenario (JSON)
        run: |
          set -euo pipefail
          python3 scripts/cost_model.py \
            --scenario-priority \
            --hands-per-day 2000 \
            --node-hourly-cost-xlm 2.0 \
            --rpc-cost-xlm 0.00001 \
            --xlm-price-usd 0.40 \
            --json > cost-report.json
          python3 -c "import json; json.load(open('cost-report.json'))"

      - name: Reject unknown circuit
        run: |
          if python3 scripts/cost_model.py --circuit-mix nope=1 >/dev/null 2>&1; then
            echo "expected failure for unknown circuit"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: cost-report.json
          if-no-files-found: ignore
