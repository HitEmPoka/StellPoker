name: Dev Environment Parity

# flake.nix and .devcontainer/ describe the same toolchain (Issue #671).
# Fail fast when one changes without the other.
on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - '.devcontainer/**'
      - 'scripts/check-devenv-parity.sh'
      - 'scripts/dev-env-doctor.sh'
  pull_request:
    branches: [main]
    paths:
      - 'flake.nix'
      - '.devcontainer/**'
      - 'scripts/check-devenv-parity.sh'
      - 'scripts/dev-env-doctor.sh'

permissions:
  contents: read

jobs:
  parity:
    name: flake.nix ↔ devcontainer parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pinned versions and package list
        run: bash scripts/check-devenv-parity.sh

      - name: Lint helper scripts
        run: shellcheck scripts/check-devenv-parity.sh scripts/dev-env-doctor.sh
