name: Docker Build & Push (GHCR)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  # Keyless cosign signing needs an OIDC token (Issue #678).
  id-token: write

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coordinator
            dockerfile: services/coordinator/Dockerfile
            context: .
          - image: mpc-node
            dockerfile: services/node/Dockerfile
            context: .
          - image: frontend
            dockerfile: app/Dockerfile
            context: app

    steps:
      - uses: actions/checkout@v4

      - name: Determine version tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Extract semantic version from git tags like vX.Y.Z.
          # If no matching tag exists, fall back to repo short SHA.
          SEMVER="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -z "$SEMVER" ]; then
            SEMVER="v0.0.0"
          fi
          # strip leading v for tag usage
          SEMVER_STRIPPED="${SEMVER#v}"

          SHA_SHORT="$(git rev-parse --short=7 HEAD)"
          echo "semver=$SEMVER_STRIPPED" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA_SHORT" >> "$GITHUB_OUTPUT"

          # GHCR requires lowercase repository names, and the Helm charts pull
          # from ghcr.io/<owner>/stellpoker/<image>.
          OWNER_LOWER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${OWNER_LOWER}/stellpoker/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:latest
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.semver }}
          # Cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: the certificate identity is this workflow on main, so
      # deploy-side verification can refuse anything else (Issue #678).
      - name: Sign image digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "ERROR: build produced no digest; refusing to sign an unknown artifact." >&2
            exit 1
          fi
          cosign sign --yes "${{ steps.meta.outputs.repo }}@${DIGEST}"

      # Publish the frontend RC channel from the same build digest so the RC
      # URL runs an identical image. Promote via scripts/promote-rc.sh after
      # the RC smoke checklist passes.
      - name: Tag frontend RC channel
        if: matrix.image == 'frontend'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.repo }}:rc" \
            "${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}"

