name: Wallet Real Extension Smoke

on:
  schedule:
    # Nightly second-tier wallet check against the official Freighter build.
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-real-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freighter-real-extension:
    name: Freighter real-extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: cd app && npm ci

      - name: Install Playwright Chromium
        run: cd app && npx playwright install --with-deps chromium

      - name: Install virtual display for extension tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download official Freighter extension
        run: |
          python3 scripts/fetch-freighter-extension.py \
            --out "$RUNNER_TEMP/freighter-extension" \
            --force

      - name: Run real-extension smoke
        env:
          CI: "true"
          REAL_FREIGHTER_SMOKE: "1"
          FREIGHTER_EXTENSION_PATH: ${{ runner.temp }}/freighter-extension
        run: |
          cd app
          xvfb-run -a npx playwright test \
            --config=e2e/playwright.config.ts \
            --project=chromium \
            tests/wallet-real-extension.spec.ts \
            --workers=1 \
            --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-real-extension-report
          path: app/playwright-report/
          retention-days: 14
