name: Flaky Test Detection & Quarantine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  detect-flaky-tests:
    name: Flaky test detection & dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Run unit tests for tracker
        run: python3 -m unittest discover tests -p "test_flaky_test_tracker.py" -v

      - name: Execute flaky test detection and update dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/flaky_test_tracker.py --auto-quarantine --create-issues --simulate-sample

      - name: Publish dashboard summary to GitHub Actions Step Summary
        run: |
          if [ -f "benchmark_data/flaky_dashboard.md" ]; then
            cat benchmark_data/flaky_dashboard.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Flaky Test Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-dashboard
          path: |
            benchmark_data/flaky_dashboard.json
            benchmark_data/flaky_dashboard.md
            tests/quarantined_tests.json
